<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PCA of all samples</title>
    <style>
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { font-family: Arial, sans-serif; color: #2a3f5f; background: #fff; }
      .plotly-graph-div { width: 100%; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 230px; }
      .plot-area { min-width: 0; min-height: 0; position: relative; background: #e5ecf6; }
      canvas, .scene-overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
      canvas { display: block; touch-action: none; cursor: grab; }
      canvas:active { cursor: grabbing; }
      .scene-overlay { pointer-events: none; }
      .toolbar { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
      .toolbar button { width: 34px; height: 34px; border: 1px solid #d8dce3; border-radius: 4px; background: rgba(255, 255, 255, .92); color: #52647c; font-size: 21px; cursor: pointer; }
      .toolbar button:hover, .toolbar button:focus-visible { color: #0068c9; border-color: #9dc8ef; }
      .legend { min-width: 0; padding: 14px 10px; overflow: auto; background: #fff; }
      .legend-title { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
      .legend-list { display: grid; gap: 2px; }
      .legend-item { min-width: 0; display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 7px; align-items: center; padding: 3px 4px; border: 0; border-radius: 3px; background: transparent; color: #2a3f5f; text-align: left; font-size: 12px; cursor: pointer; }
      .legend-item:hover, .legend-item:focus-visible { background: #eef3f8; }
      .legend-item.disabled { opacity: .35; }
      .swatch { width: 10px; height: 10px; border-radius: 50%; }
      .legend-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tooltip { position: absolute; z-index: 4; max-width: 230px; padding: 8px 10px; border: 1px solid #fff; border-radius: 3px; background: rgba(82, 100, 124, .94); color: #fff; font-size: 12px; line-height: 1.45; pointer-events: none; }
      .status { position: absolute; inset: 0; display: grid; place-items: center; color: #69738a; }
      @media (max-width: 700px) {
        .plotly-graph-div { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 150px; }
        .legend-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <div id="pca-viewer" class="plotly-graph-div">
      <div class="plot-area">
        <canvas aria-label="Interactive three-dimensional PCA scatter plot"></canvas>
        <svg class="scene-overlay" aria-hidden="true"><title>PCA of all samples</title></svg>
        <div class="toolbar">
          <button id="reset-view" type="button" title="Reset view" aria-label="Reset view">&#8635;</button>
          <button id="save-image" type="button" title="Save PNG" aria-label="Save PNG">&#8681;</button>
        </div>
        <div id="pca-tooltip" class="tooltip" hidden></div>
        <div id="pca-status" class="status">Loading...</div>
      </div>
      <aside class="legend" aria-label="Breed legend">
        <h1 class="legend-title">BREED</h1>
        <div class="legend-list"></div>
      </aside>
    </div>
    <script type="module" src="/js/pca.js"></script>
  </body>
</html>
